<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Vue - Introduktion</title>
    <link rel="stylesheet" type="text/css" href="css/style.css">
</head>
<body>
    
<script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>

<div id="app">
  <h1>{{ header }}</h1>
  <p>{{ message }}</p>
</div>

<script>

  const { createApp } = Vue

  createApp({
    data() {
      return {
        header: 'First Vue App',
        message: 'Hello Goodbye!'
      }
    }
  }).mount('#app')
  
</script>

</body>
</html>
