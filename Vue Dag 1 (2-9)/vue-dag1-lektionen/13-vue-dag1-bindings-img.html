<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Vue - Introduktion</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="app">
        <h1>{{ product }}</h1>
        <img :src="image" alt="">
    </div>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script>
        const {createApp} = Vue

        createApp({
            data(){
                return{
                    product: 'Album',
                    image: 'img/mountainflame-500px.jpg'
                }
            }
        }).mount('#app')
    </script>


</body>
</html>
