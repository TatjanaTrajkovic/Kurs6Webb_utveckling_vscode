<body>
    <h1>Lägg till en skiva:</h1>

    <!-- vart requesten ska skickas och vilken request-metod som ska användas -->

        <label>Artist:</label>
        <input type="text" name="artist">

        <label>Title:</label>
        <input type="text" name="title">

        <button type="submit">Skicka</button>
    </form>

</body>
