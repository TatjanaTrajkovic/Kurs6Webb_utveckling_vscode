<body>
    
    <h1>Mina recept</h1>

    <form id="profilForm">

        <label for="namn">Ditt namn:</label>
        <input type="text" id="namn">

        <label for="favorit">Favoritingrendiens:</label>

        <select id="favorit">
            <option value="choklad">Choklad</option>
            <option value="kyckling">Kyckling</option>
            <option value="pasta">Pasta</option>
        </select>

        <button type="submit">Spara</button>

    </form>

    <div id="profil"></div>



</body>
