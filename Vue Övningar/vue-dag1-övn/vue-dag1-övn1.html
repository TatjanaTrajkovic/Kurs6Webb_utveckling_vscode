<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>

    <div id="app">
        <h1>{{ header }}</h1>
        <p>{{ message }}</p>
    </div>

    <script>
        const { createApp } = Vue

        createApp({
            data(){
                return{
                    header: 'Välkommen till mitt första Vue app!',
                    message: 'Detta är Tanjas första Vue app!'
                }
            }
        }).mount('#app')


    </script>






</body>
</html>
