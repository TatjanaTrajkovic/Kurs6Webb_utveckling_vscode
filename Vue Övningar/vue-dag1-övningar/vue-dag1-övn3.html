<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <div id="app">
        <h1>{{ message }}</h1>
        <button @click="showGreeting">Visa hälsning</button>
    </div>

    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>

    <script>
        const { createApp} = Vue

        createApp({
            data(){
                return{
                    message: ''
                }
            },
            methods: {
                showGreeting(){
                    
                    let date = new Date()
                    let hour = date.getHours()

                    if(hour < 10){
                        this.message = 'God morgon'
                    }else if(hour < 12){
                        this.message = 'God förmiddag'
                    }else if(hour < 18){
                        this.message = 'God eftermiddag'
                    }else{
                        this.message = 'God kväll'
                    }
                    

                }
            }

        }).mount('#app')

    </script>

</body>
</html>
