<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <h1>Gissa numret</h1>
        <p>Gissa ett nummer mellan 1 och 10.</p>
        
        <input type="number" v-model="guess" min="1" max="10">

        <button @click="checkGuess">Gissa</button>
        <p>Du gissade: {{ message }}</p>
        

    </div>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script>
        const {createApp} = Vue

        createApp({
            data(){
                return{
                    message: '',
                    randomNumber: Math.floor(Math.random() * 10) + 1,
                    guess: ''
                }
            },
            methods: {
                checkGuess(){
                    if(this.guess < this.randomNumber){
                        this.message = 'Ditt nummer är för lågt!'
                    }else if(this.guess > this.randomNumber){
                        this.message = 'Ditt nummer är för högt!'
                    }else{
                        this.message = 'Du har gissat rätt'
                        this.randomNumber = 
                            Math.floor(Math.random() * 10) + 1 // här skapas en ny random nr
                    }
                }
            }
        }).mount('#app')
    </script>



</body>
</html>
