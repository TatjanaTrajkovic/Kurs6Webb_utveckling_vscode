<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div id="app">
        <button-counter></button-counter>
    </div>

    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>

    <script>
        const { createApp } = Vue
        createApp({

        }).component('button-counter', {
            data(){
                return{
                    count: 0
                }
            },
            template: `
                <button @click="count++">
                    Du har clickat {{count}} gånger
                </button>
            `
        }).mount('#app')
    </script>


</body>
</html>
