<!DOCTYPE html><html lang="en"><head>	<meta charset="utf-8">		<title>Forms</title>	</head>	<body>		<form action="">			<h1>Your Details:</h1>			<p><label>Name: <input type="text" required="required" placeholder="Ditt namn:" name="name" maxlength="100"></label></p>			<p><label>Email: <input type="email" placeholder="Din email:" name="email" maxlength="100"></label></p>			<h2>Your Review:</h2>				<p>					<label for="hear-about">How did you hear about us?</label> <br>					<select name="referrer" id="hear-about">						<option value="google">Google</option>						<option value="friend">Friend</option>						<option value="advert">Advert</option>						<option value="other">Other</option>					</select>				</p>				<p>					Would you visit again?<br>					<label><input type="radio" name="rating" value="yes"> Yes</label>					<label><input type="radio" name="rating" value="no"> No</label>					<label><input type="radio" name="rating" value="maybe"> Maybe</label>				</p>			<p><label for="comments">Comments:</label></p>			<p><textarea rows="4" cols="40" id="comments"></textarea></p>			<p><label><input type="checkbox" name="subscribe" checked="checked"> Sign me up for email updates</label></p>			<p></p><input type="submit" value="Submit review"></p>		</form>	</body></html>
