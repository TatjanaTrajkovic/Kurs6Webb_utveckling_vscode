<!DOCTYPE html>

<header>
    <h1>Led Zeppelin</h1>
</header>
    

    <img src="img/Celebration-Led-Zeppelin.jpg" alt="Cover">

    <h3>My favorite albums by Led Zeppelin:</h3>

    <ul>
        <li><a href="skiva.html">Album Led Zeppelin III</a></li>
        <li><a href="skiva2.html">Album Physical Graffiti</a></li>
    </ul>

    <form action="">
        <h3>Önska en skiva</h3>
            <p>
                <label for="name">Namn:</label>
                <input type="text" id="name" name="name" placeholder="Ditt namn..." required>
            </p>

            <p>
                <label for="email">E-post:</label>
                <input type="text" id="email" placeholder="Din e-post..." required>
            </p>

            <p>
                <label for="album">Album:</label>
                <input type="text" id="album" name="album" placeholder="Album..." required>
                
            </p>

            <p>
                <label for="year">Utgivningsår:</label>
                <input type="number" id="year" name="year" min="1900" max="2026">
            </p>

            <p>
                <input type="submit" value="Önska skiva">
            </p>
    </form>

    <a href="registrering.html">Bli medlem</a>
