<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bli medlem</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <h1>Bli medlem</h1>

    <form action="">

        <p>
        <label for="firstname">Förnamn:</label>
        <input type="text" id="firstname" name="firstname" placeholder="Namn..." required>
        </p>  
        
        <p>
        <label for="lastname">Efternamn:</label>
        <input type="text" id="lastname" name="lastname" placeholder="Efternamn..." required>
        </p>

        <p>
        <label for="email">E-post:</label>
        <input type="email" id="email" name="email" placeholder="E-post..." required>
        </p>

        <p>
        <label for="password">Lösenord:</label>
        <input type="password" id="password" name="password" minlength="6" placeholder="Lösenord..." required>
        </p>

        <p>
        <input type="submit" value="Registrera">
        </p>

    </form>

    <a href="index.html">Tillbaka till startsidan</a>

</body>
</html>
